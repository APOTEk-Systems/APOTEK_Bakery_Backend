name: Deploy Bakery Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/bakery-backend

            echo "📦 Pulling latest backend code"
            git pull origin main

            echo "📁 Ensuring tenant directories exist"
            mkdir -p mkate demo apotek

            echo "📦 Installing dependencies for all tenants"
            for dir in mkate demo apotek; do
              cd /var/www/bakery-backend/$dir
              npm install
              npm run build
            done

            echo "🚀 Restarting backend via PM2"
            cd /var/www/bakery-backend
            pm2 start ecosystem.config.js || pm2 reload ecosystem.config.js

            pm2 save
            echo "✅ Deployment complete"