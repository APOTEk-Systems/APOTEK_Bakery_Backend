name: Deploy Bakery Backend

on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            BASE_DIR="/var/www/bakery-backend"
            echo "📁 Ensuring tenant directories exist"
            mkdir -p "$BASE_DIR/mkate" "$BASE_DIR/demo" "$BASE_DIR/apotek"

            for tenant in mkate demo apotek; do
              TENANT_DIR="$BASE_DIR/$tenant"

              if [ -d "$TENANT_DIR/.git" ]; then
                echo "🔄 Deploying backend for $tenant"

                cd "$TENANT_DIR"

                # Reset local changes
                git reset --hard

                # Pull latest code
                git pull origin main || echo "⚠️ git pull failed for $tenant, skipping"

                echo "📦 Installing dependencies"
                npm install

              else
                echo "⏭️ Skipping $tenant (no git repo)"
              fi
            done

            echo "🚀 Restarting backend via PM2"
            cd "$BASE_DIR"
            pm2 start ecosystem.config.js || pm2 reload ecosystem.config.js
            pm2 save

            echo "✅ Deployment complete"
