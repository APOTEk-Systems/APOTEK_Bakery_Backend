name: Deploy Bakery Backend

on:
  push:
    branches:
      - main
  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/bakery-backend

            echo "📦 Pulling shared backend repo"
            git pull origin main

            echo "📁 Ensuring tenant directories exist"
            mkdir -p mkate demo apotek

            for tenant in mkate demo apotek; do
              cd /var/www/bakery-backend/$tenant

              if [ -d ".git" ]; then
                echo "🔄 Deploying backend for $tenant"
                npm install
                npm run build
              else
                echo "⏭️ Skipping $tenant (no git repo)"
              fi
            done

            echo "🚀 Restarting backend via PM2"
            cd /var/www/bakery-backend
            pm2 start ecosystem.config.js || pm2 reload ecosystem.config.js
            pm2 save
