name: Deploy Backend (Dynamic Tenants)

on:
  push:
    branches: [main]
    
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Add this step to verify secrets are actually set
      - name: Verify secrets exist
        run: |
          echo "Host length: ${{ secrets.TEST_SSH_HOST != '' }}"
          echo "User length: ${{ secrets.TEST_SSH_USER != '' }}"
          echo "Key length: ${#SSH_KEY}"
        env:
          SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
      
      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          debug: true
          script: |
            set -e

            BASE_DIR=/var/www/bakery

            echo "📂 Scanning tenants in $BASE_DIR"

            for BACKEND_DIR in $BASE_DIR/*/backend; do
              TENANT=$(basename $(dirname "$BACKEND_DIR"))
              echo "🚀 Deploying backend for tenant: $TENANT from $BACKEND_DIR"

              if [ ! -d "$BACKEND_DIR/.git" ]; then
                echo "❌ Git repo missing in $BACKEND_DIR, skipping $TENANT"
                continue
              fi

              cd "$BACKEND_DIR"

              echo "📥 Pulling latest code"
              git fetch origin
              git reset --hard origin/main

              echo "📦 Installing dependencies and building"
              cd tenant
              npm install --production=false
              npm run build

              cd ..

              PM2_APP="${TENANT}-backend"

              if pm2 list | grep -q "$PM2_APP"; then
                echo "♻️ Reloading PM2 app: $PM2_APP"
                pm2 reload ecosystem.config.js --only "$PM2_APP" --update-env
              else
                echo "▶️ Starting PM2 app: $PM2_APP"
                pm2 start ecosystem.config.js --only "$PM2_APP"
              fi

            done

            echo "💾 Saving PM2 process list"
            pm2 save